<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue Clicker</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h2>Простой кликер</h2>
        <p>Количество очков: {{ score }}</p>
        <button @click="increment">Кликни меня!</button>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const score = ref(0);

                const increment = () => {
                    score.value++;
                };

                return { score, increment };
            }
        }).mount('#app');
    </script>
</body>
</html>
